services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      AUTH_SECRET: ${AUTH_SECRET:-}
      DATA_DIR: /data
      RETENTION_DAYS: ${RETENTION_DAYS:-3}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      MAX_FILESIZE_MB: ${MAX_FILESIZE_MB:-2048}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-0}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PORT: "8787"
      PROXY_HEADERS: ${PROXY_HEADERS:-0}
    volumes:
      - archive_downloads:/data/downloads
      - archive_cookies:/data/cookies
      - archive_db:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  archive_downloads:
  archive_cookies:
  archive_db:
