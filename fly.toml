# 把 app 改成你自己的 Fly 应用名。卷名要和 `fly volumes create archive_data` 一致。
app = "personal-media-archive"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  PROXY_HEADERS = "1"
  RETENTION_DAYS = "3"
  MAX_CONCURRENT = "2"
  MAX_FILESIZE_MB = "2048"
  MAX_DURATION_SEC = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "25s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[mounts]]
  source = "archive_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
